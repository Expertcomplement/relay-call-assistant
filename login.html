<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Relay</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#182437;font:14px 'DM Sans',sans-serif}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:32px;width:min(390px,calc(100% - 32px));box-shadow:0 14px 48px #263a5b12}.brand{font:800 21px Manrope;display:flex;align-items:center;gap:10px;margin-bottom:30px}.logo{width:36px;height:36px;border-radius:11px;background:#4b5fe8;color:white;display:grid;place-items:center;font-size:19px}h1{font:800 23px Manrope;margin:0 0 7px}.sub{color:#718097;margin:0 0 24px}.field label{display:block;font-size:11px;font-weight:700;color:#59677b;margin-bottom:7px}.field input{width:100%;border:1px solid #dfe5ed;border-radius:8px;padding:12px;font:14px 'DM Sans';outline:none}.field input:focus{border-color:#8a96ef;box-shadow:0 0 0 3px #4b5fe81c}button{width:100%;margin-top:16px;background:#4b5fe8;border:0;color:white;border-radius:8px;padding:13px;font:700 13px 'DM Sans';cursor:pointer}.msg{display:none;margin:0 0 14px;border-radius:8px;padding:10px 12px;background:#fff1ef;color:#a43b3f;font-size:12px}.msg.show{display:block}.fine{font-size:11px;color:#8792a2;line-height:1.5;margin:20px 0 0}
</style></head><body><main class="card"><div class="brand"><div class="logo">↗</div>relay</div><h1>Welcome back</h1><p class="sub">Sign in to your private call assistant.</p><div id="msg" class="msg"></div><form method="post" action="/auth/login"><div class="field"><label for="password">APP PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div><button type="submit">Sign in</button></form><p class="fine">Calls are private to your account. Relay identifies itself as an AI assistant on every call.</p></main><script>const p=new URLSearchParams(location.search).get('error'),m=document.querySelector('#msg');if(p){m.textContent=p==='slowdown'?'Too many attempts. Wait 15 minutes and try again.':'That password did not match.';m.classList.add('show')}</script></body></html>
